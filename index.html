<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" id="metaTheme">
<title>Clip Downloader | ANIMEMISO Network</title>
<link rel="icon" id="fav" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#ffffff;--card:#ffffff;--card2:#f4f4f5;--line:#e4e4e7;--text:#111114;--mute:#5f6673;--acc:#111114;--onacc:#ffffff;--ok:#16a34a;--bad:#dc2626;--shadow:0 8px 24px #0000000f;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,"Noto Sans Thai","Noto Sans SC","Noto Sans JP","Noto Sans KR",sans-serif;line-height:1.6;padding-bottom:100px;transition:background .3s,color .3s}
::selection{background:var(--acc);color:var(--onacc)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--acc)}
input[type=range]{accent-color:var(--acc)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
a{color:inherit}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--bg);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:18px}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--acc)}
.menu{margin-left:auto;display:flex;gap:2px}
.menu a{text-decoration:none;color:var(--mute);font-size:14px;padding:8px 12px;border-radius:10px}
.menu a:hover{color:var(--text);background:var(--card2)}
select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;font-size:15px}
.iconbtn:hover{border-color:var(--acc)}
@media(max-width:760px){.menu{display:none}.brand{margin-right:auto}}

/* theme panel */
.panel{position:fixed;top:66px;right:12px;z-index:70;width:min(320px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 20px 50px #0003;display:none}
.panel.on{display:block;animation:rise .25s}
.panel h4{font-size:14px;margin-bottom:4px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw button.on{outline:2px solid var(--acc);outline-offset:2px}
.cust{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
.cust input{width:54px;height:36px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px;cursor:pointer}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:42px 18px 30px}
.art img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:5px solid var(--acc);box-shadow:0 24px 60px #0003,0 0 0 10px var(--card2);display:block}
@media(max-width:800px){.hero{grid-template-columns:1fr;gap:22px;padding:24px 18px 30px}.hero .art{order:-1;width:min(220px,56vw);margin-left:auto}}
.kick{font-weight:800;line-height:1.08;font-size:clamp(34px,6.2vw,58px);letter-spacing:-.5px}
.hero p.lead{color:var(--mute);font-size:16px;margin:16px 0 18px;max-width:520px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;color:var(--mute)}
.pill b{color:var(--text);font-weight:700}
.net{margin-top:16px;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--mute);text-transform:uppercase}
.net b{color:var(--text)}

/* tabs */
.tabs{display:flex;gap:8px;max-width:620px;margin:0 auto 14px}
.tabs button{flex:1;background:var(--card);color:var(--mute);border:1px solid var(--line);border-radius:12px;padding:13px 8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.tabs button i{margin-right:6px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}

/* cards + tool */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.tool{max-width:620px;margin:0 auto}
.page{display:none}.page.on{display:block}
.label{font-family:var(--mono);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mute)}
.det{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.pico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.pico.yt{background:#e62117}.pico.tt{background:#0aa5a0}.pico.sp{background:#1db954}.pico.off{background:var(--line);color:var(--mute)}
.pn{font-weight:700;font-size:17px}
.ps{font-size:12px;color:var(--mute)}
.field{position:relative}
.field input,select.f{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 44px 14px 14px;color:var(--text);font-size:15px;outline:none}
select.f{padding-right:14px}
.field input:focus,select.f:focus{border-color:var(--acc)}
.field .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:10px;border:0;background:var(--card2);color:var(--mute);cursor:pointer;font-size:16px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc)}
.btn i{margin-right:6px}
.btn.p{flex:1;background:var(--acc);border-color:var(--acc);color:var(--onacc);position:relative;overflow:hidden}
.btn.p:hover{transform:translateY(-1px);box-shadow:0 8px 20px #0003}
.btn:active{opacity:.85}.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn.p.loading::after{content:"";position:absolute;inset:0;background-image:linear-gradient(45deg,color-mix(in srgb,var(--onacc) 20%,transparent) 25%,transparent 25%,transparent 50%,color-mix(in srgb,var(--onacc) 20%,transparent) 50%,color-mix(in srgb,var(--onacc) 20%,transparent) 75%,transparent 75%);background-size:28px 28px;animation:stripes .7s linear infinite}
@keyframes stripes{to{background-position:28px 0}}

/* download animation */
.dlbox{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:16px;padding:20px;border:1px dashed var(--line);border-radius:16px}
.dlbox.on{display:flex;animation:rise .3s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--acc);stroke-dasharray:276.46;stroke-dashoffset:276.46}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px}
.ring::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--acc);opacity:0;animation:ping 1.5s ease-out infinite}
@keyframes ping{0%{transform:scale(.92);opacity:.45}100%{transform:scale(1.28);opacity:0}}
.ring.done::after{animation:none}
.ring.done{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.ring.done .pct{font-size:34px;color:var(--ok)}
@keyframes pop{from{transform:scale(.8)}}
.stxt{font-size:13px;color:var(--mute);min-height:20px}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.err{display:none;color:var(--bad);font-size:13px;margin-top:10px;text-align:center}
.note{margin-top:12px;font-size:12px;color:var(--mute);text-align:center}
.res{display:none;margin-top:14px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px;animation:rise .4s}
.res .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ready{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--ok);border:1px solid var(--ok);border-radius:20px;padding:4px 12px}
.res h3{font-size:20px;margin-bottom:10px;word-break:break-word}
.res img{width:100%;border-radius:12px;margin-bottom:10px}
.res audio{width:100%;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:8px 0;border-top:1px solid var(--line)}
.kv b{color:var(--text);font-weight:600}
.sv{display:block;text-align:center;text-decoration:none;background:var(--acc);color:var(--onacc);border-radius:12px;padding:13px;font-weight:700;margin-top:10px}
label.l{display:block;margin:14px 0 6px}
input[type=file]{width:100%;background:var(--card);border:1px dashed var(--mute);border-radius:14px;padding:16px;color:var(--mute);font-size:13px}
.h2s{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{color:var(--mute);font-size:13px}

/* sections */
section{padding:44px 0 6px}
.st{margin-bottom:18px}
.st h2{font-size:clamp(24px,4vw,32px);margin-top:6px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
@media(max-width:760px){.about{grid-template-columns:1fr}}
.about p{color:var(--mute);font-size:15px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.g3{grid-template-columns:1fr}}
@media(max-width:420px){.g4{grid-template-columns:1fr}}
.feat h3,.step h3{font-size:17px;margin-bottom:4px}
.feat p,.step p{font-size:13px;color:var(--mute)}
.feat .n,.step .n{font-family:var(--mono);color:var(--text);font-size:13px;margin-bottom:10px;display:block;font-weight:700}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 18px;margin-bottom:8px}
summary{cursor:pointer;padding:15px 0;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--text);font-size:20px;line-height:1}
details[open]{border-color:var(--acc)}
details[open] summary::after{content:"–"}
details p{color:var(--mute);font-size:14px;padding-bottom:15px}
.netbox{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
@media(max-width:560px){.netbox{grid-template-columns:1fr;text-align:center}.netbox img{max-width:170px;margin:0 auto}}
.netbox img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid var(--acc)}
.netbox h2{font-size:22px;margin-bottom:6px}
.netbox p{color:var(--mute);font-size:14px;margin-bottom:14px}
.cl{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:560px){.cl{justify-content:center}}
.cl a{background:var(--card2);border:1px solid var(--line);text-decoration:none;font-size:13px;padding:10px 14px;border-radius:12px}
.cl a:hover{border-color:var(--acc)}
.donate{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
@media(max-width:560px){.donate{justify-content:center}}
.donate .btn{padding:9px 14px;font-size:13px;font-family:var(--mono)}
footer{margin-top:40px;padding:22px 0;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--mute)}
footer b{color:var(--text)}

/* music */
#pl{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:calc(100% - 24px);max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:18px;z-index:50;box-shadow:0 10px 30px #0002}
.plist{display:none;max-height:240px;overflow:auto;border-bottom:1px solid var(--line);padding:8px}
.plist.on{display:block}
.pi{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px}
.pi:hover{background:var(--card2)}
.pi.cur{background:var(--card2);font-weight:700}
.pi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .tg{font-size:10px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--mute)}
.pi .rm{border:0;background:none;color:var(--mute);cursor:pointer;padding:4px 6px}
.pi .rm:hover{color:var(--bad)}
.player{padding:8px 10px;display:flex;align-items:center;gap:6px}
.player button{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;font-size:13px;flex:none}
.player button.main{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.player .t{flex:1;min-width:0;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.player .t b{color:var(--text);font-weight:600}
.player input[type=range]{width:60px;flex:none}
@media(max-width:480px){.player input[type=range]{display:none}}

/* account + authentication */
.account-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;max-width:190px}
.account-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-btn:hover{border-color:var(--acc)}
.auth-overlay{position:fixed;inset:0;z-index:120;background:#08080bf2;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:18px}
.auth-overlay.on,body.auth-locked .auth-overlay{display:flex;animation:authFade .22s ease}
body.auth-locked{overflow:hidden}body.auth-locked main,body.auth-locked header,body.auth-locked footer,body.auth-locked #pl,body.auth-locked #panel,body.auth-locked #amx-quick-actions,body.auth-locked #amx-admin-footer{visibility:hidden}
.auth-card{width:min(430px,100%);background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 24px 80px #0005;animation:authRise .28s ease}
.auth-brand{text-align:center;margin-bottom:18px}.auth-brand .mark{width:58px;height:58px;border-radius:50%;border:2px solid var(--acc);object-fit:cover}.auth-brand h2{font-size:23px;margin-top:8px}.auth-brand p{font-size:13px;color:var(--mute)}
.auth-tabs{display:flex;gap:8px;background:var(--card2);padding:5px;border-radius:12px;margin:16px 0}
.auth-tabs button{flex:1;border:0;border-radius:9px;padding:10px;background:transparent;color:var(--mute);font-weight:700;cursor:pointer}
.auth-tabs button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px #0001}
.auth-field{margin:12px 0}.auth-field label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}.auth-field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;outline:none}.auth-field input:focus{border-color:var(--acc)}
.auth-submit{width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font-weight:800;font-size:15px;cursor:pointer;margin-top:8px}.auth-submit:disabled{opacity:.6;cursor:wait}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.auth-link{border:0;background:none;color:var(--mute);font-size:12px;text-decoration:underline;cursor:pointer}
.auth-msg{min-height:20px;margin-top:10px;font-size:12px;text-align:center;color:var(--bad)}.auth-close{float:right;border:0;background:var(--card2);color:var(--text);border-radius:10px;width:34px;height:34px;font-size:20px;cursor:pointer}
.auth-profile{text-align:center;padding:10px 0}.auth-profile .mail{color:var(--mute);font-size:13px;word-break:break-word}.auth-logout{margin-top:18px;background:var(--card2);color:var(--text);border:1px solid var(--line)}
/* brief processing overlay for navigation */
#page-loader{position:fixed;inset:0;z-index:110;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#page-loader.on{display:flex;animation:authFade .15s ease}
#page-loader .loader-ring{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:loaderSpin .75s linear infinite}
#page-loader p{font-size:12px;color:var(--mute);letter-spacing:.4px}
.page{opacity:0;transform:translateY(5px);transition:opacity .22s ease,transform .22s ease}.page.on{display:block;opacity:1;transform:translateY(0);animation:rise .25s ease}
@keyframes loaderSpin{to{transform:rotate(360deg)}}@keyframes authFade{from{opacity:0}to{opacity:1}}@keyframes authRise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:520px){.account-btn{padding:8px 9px}.account-btn span{max-width:70px}.auth-card{padding:19px}}
</style>
</head>
<body class="auth-locked">

<header>
  <div class="wrap nav">
    <a class="brand" href="#top"><img data-logo alt="">Clip Downloader</a>
    <nav class="menu">
      <a href="#tool" data-t="nav_dl"></a>
      <a href="#about" data-t="about_title"></a>
      <a href="#features" data-t="nav_feat"></a>
      <a href="#how" data-t="nav_how"></a>
      <a href="#faq" data-t="nav_faq"></a>
      <a href="#contact" data-t="nav_contact"></a>
    </nav>
    <button class="account-btn" id="accountBtn" onclick="ANIMEMISOAuth.open()" aria-label="บัญชีผู้ใช้"><i class="fa-regular fa-user"></i><span id="accountLabel">เข้าสู่ระบบ</span></button>
    <button class="iconbtn" onclick="togglePanel()" aria-label="theme"><i class="fa-solid fa-palette"></i></button>
    <select id="lang" onchange="setLang(this.value)">
      <option value="th">ไทย</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option>
      <option value="id">Indonesia</option><option value="vi">Tiếng Việt</option><option value="ms">Melayu</option><option value="en">English</option>
    </select>
  </div>
</header>

<div class="panel" id="panel">
  <h4 data-t="theme"></h4>
  <div class="sw" id="sw"></div>
  <div class="cust"><span data-t="custom"></span><input type="color" id="cpick" value="#ffffff"></div>
</div>

<main id="top">
  <div class="wrap hero">
    <div>
      <h1 class="kick" data-t="kick"></h1>
      <p class="lead" data-t="hero_sub"></p>
      <div class="pills"><span class="pill"><b>YT</b> YouTube</span><span class="pill"><b>TT</b> TikTok</span><span class="pill"><b>SP</b> Spotify</span></div>
      <div class="net"><span data-t="network"></span> · <b>ANIMEMISO</b></div>
    </div>
    <div class="art"><img data-logo alt="ANIMEMISO"></div>
  </div>

  <div class="wrap" id="tool">
    <div class="tabs">
      <button id="tb1" class="on" onclick="tab(1)"><i class="fa-solid fa-circle-down"></i><span data-t="tab1"></span></button>
      <button id="tb2" onclick="tab(2)"><i class="fa-solid fa-music"></i><span data-t="tab2"></span></button>
    </div>

    <!-- หน้า 1 -->
    <div class="page on" id="p1"><div class="card tool">
      <div class="det" id="det"></div>
      <div class="field">
        <input id="url" type="url" inputmode="url" autocomplete="off" oninput="detect()">
        <button class="x" onclick="clearUrl()">✕</button>
      </div>
      <div class="row">
        <button class="btn p" id="dlBtn" onclick="start('video')"><i class="fa-solid fa-download"></i><span data-t="download"></span></button>
        <button class="btn" id="mp3Btn" onclick="start('mp3')">MP3</button>
        <button class="btn" onclick="pasteUrl()" data-t="paste"></button>
      </div>
      <div class="dlbox" id="dbox">
        <div class="ring" id="dring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44"/><circle class="fgc" id="dfg" cx="50" cy="50" r="44"/></svg><div class="pct" id="dpct">0%</div></div>
        <div class="stxt" id="dtxt"></div>
      </div>
      <div class="err" id="err"></div>
      <div class="res" id="res">
        <div class="top"><span class="label" data-t="res_label"></span><span class="ready" data-t="ready"></span></div>
        <h3 id="rtitle"></h3>

const BG_PRESETS = ['#ffffff','#f3f4f6','#fdf6e3','#ffe4ef','#e6f7ee','#e3f1ff','#0a0a0c','#0f172a'];
const hex2rgb = h => { h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; };
const rgb2hex = a => '#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix = (a,b,p) => { const A=hex2rgb(a),B=hex2rgb(b); return rgb2hex(A.map((v,i)=>v*(1-p)+B[i]*p)); };
function applyBg(hex){
  const [r,g,b] = hex2rgb(hex), dark = (0.299*r+0.587*g+0.114*b)/255 < 0.5, s = document.documentElement.style;
  s.setProperty('--bg',hex);
  if(dark){
    s.setProperty('--text','#f3f4f6'); s.setProperty('--mute','#a1a1aa');
    s.setProperty('--card',mix(hex,'#ffffff',.06)); s.setProperty('--card2',mix(hex,'#ffffff',.11)); s.setProperty('--line',mix(hex,'#ffffff',.18));
    s.setProperty('--acc','#ffffff'); s.setProperty('--onacc','#111114'); s.setProperty('--shadow','0 8px 24px #0006');
  }else{
    s.setProperty('--text','#111114'); s.setProperty('--mute','#5f6673');
    s.setProperty('--card',mix(hex,'#ffffff',.6)); s.setProperty('--card2',mix(hex,'#000000',.045)); s.setProperty('--line',mix(hex,'#000000',.12));
    s.setProperty('--acc','#111114'); s.setProperty('--onacc','#ffffff'); s.setProperty('--shadow','0 8px 24px #0000000f');
  }
  $('metaTheme').content = hex; $('cpick').value = hex;

/* ===== วงแหวนแอนิเมชันตอนโหลด ===== */
function Prog(p){
  const box=$(p+'box'), ring=$(p+'ring'), fg=$(p+'fg'), pct=$(p+'pct'), tx=$(p+'txt'), C=276.46;
  let cur=0, cap=0, timer=null;
  const draw = v => { cur=v; fg.style.strokeDashoffset = C*(1-v/100); if(!ring.classList.contains('done')) pct.textContent = Math.round(v)+'%'; };
  return {
    start(txt){
      clearInterval(timer); ring.classList.remove('done'); box.classList.add('on');
      draw(0); cap=10; this.text(txt);
      timer = setInterval(()=>{ if(cur<cap) draw(Math.min(cap, cur+(cap-cur)*0.12+0.15)); }, 60);
    },
    set(c,txt){ cap=c; if(txt) this.text(txt); },
    text(txt){ tx.textContent = txt||''; tx.classList.add('dots'); },
    finish(txt){
      clearInterval(timer); draw(100); ring.classList.add('done');
      pct.innerHTML = '<i class="fa-solid fa-check"></i>'; tx.classList.remove('dots'); tx.textContent = txt||'';
    },
    hide(){ clearInterval(timer); box.classList.remove('on'); ring.classList.remove('done'); }
  };
}
const dp = Prog('d'), cp = Prog('c');

}

/* ===== หน้า 2: แปลงคลิปเป็นเสียง (ทำงานในเบราว์เซอร์) ===== */
function toWav(ch, sr){
  const n = ch[0].length, c = ch.length, len = n*c*2;
  const buf = new ArrayBuffer(44+len), v = new DataView(buf);
  const w = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+len,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,c,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*c*2,true); v.setUint16(32,c*2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,len,true);
  let o = 44;
  for(let i=0;i<n;i++) for(let k=0;k<c;k++){
    const s = Math.max(-1,Math.min(1,ch[k][i]));
    v.setInt16(o, s<0 ? s*0x8000 : s*0x7FFF, true); o += 2;
  }
  return new Blob([buf],{type:'audio/wav'});
}
const i16 = f => { const o=new Int16Array(f.length); for(let i=0;i<f.length;i++){ const s=Math.max(-1,Math.min(1,f[i])); o[i]=s<0?s*0x8000:s*0x7FFF; } return o; };
async function toMp3(ch, sr){
  const enc = new lamejs.Mp3Encoder(ch.length, sr, 128);
  const L = i16(ch[0]), R = ch[1] ? i16(ch[1]) : null;
  const out = [], step = 1152*20;
  for(let i=0;i<L.length;i+=step){
    const a = L.subarray(i,i+step);
    const d = R ? enc.encodeBuffer(a, R.subarray(i,i+step)) : enc.encodeBuffer(a);
    if(d.length) out.push(d);
    cp.set(45 + 50*i/L.length);
    if((i/step)%20===0) await sleep(0);
  }
  const e = enc.flush(); if(e.length) out.push(e);
  return new Blob(out,{type:'audio/mpeg'});
}
let cbusy = false;
async function convert(){
  if(cbusy) return;
  const f = $('vf').files[0];
  $('cerr').style.display='none'; $('cres').style.display='none';
  if(!f) return showErr('cerr',t('c_none'));
  if(f.size > 200*1024*1024) return showErr('cerr',t('c_big'));
  cbusy = true; $('cvBtn').disabled = true; $('cvBtn').classList.add('loading');
  try{
    cp.start(t('c1'));
    const buf = await f.arrayBuffer();
    cp.set(25,t('c2'));
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const ab = await ctx.decodeAudioData(buf);
    ctx.close();
    const chs = [];
    for(let i=0;i<Math.min(2,ab.numberOfChannels);i++) chs.push(ab.getChannelData(i));
    cp.set(45,t('c3'));
    await sleep(30);
    const type = $('fmt').value;
    let blob, ext = type;
    if(type==='mp3' && window.lamejs) blob = await toMp3(chs, ab.sampleRate);
    else { blob = toWav(chs, ab.sampleRate); ext = 'wav'; }
    cp.finish(t('s4')); await sleep(900); cp.hide();
    const url = URL.createObjectURL(blob);
    $('caud').src = url;
    const a = $('clink'); a.href = url;
    a.download = (f.name.replace(/\.[^.]+$/,'') || 'audio') + '.' + ext;
    $('cres').style.display='block';
  }catch(e){ cp.hide(); showErr('cerr',t('c_fail')); }
  cbusy = false; $('cvBtn').disabled = false; $('cvBtn').classList.remove('loading');
}

  try{

    rq.onupgradeneeded = () => rq.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true});
    rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
  }catch(e){ res(null); }
});

  const db = await idb; if(!db) return null;
  return new Promise(r => {
    try{ const tx = db.transaction('songs',mode); const rq = fn(tx.objectStore('songs')); tx.oncomplete = () => r(rq && rq.result); tx.onerror = () => r(null); }
    catch(e){ r(null); }
  });
}

  if(!list.length){
    si = 0; aud.removeAttribute('src'); aud.load();
    $('tname').textContent = 'ยังไม่มีเพลง · เพิ่มเพลงของคุณได้';
    renderList(); return;
  }
  si = (i + list.length) % list.length;
  aud.src = list[si].src; $('tname').textContent = list[si].name; renderList();
  if(play) aud.play().catch(()=>{});
}
function toggle(){ aud.paused ? aud.play().catch(()=>{}) : aud.pause(); }
function next(){ load(si+1, !aud.paused); }
function prev(){ load(si-1, !aud.paused); }
function removeSong(i){
  const s = list[i]; if(s.def) return;
  dbTx('readwrite', st => st.delete(s.id)); URL.revokeObjectURL(s.src);
  const wasCur = i === si; list.splice(i,1);
  if(wasCur){ aud.pause(); load(0,false); } else { if(i < si) si--; renderList(); }
}
$('addf').addEventListener('change', async e => {
  let first = -1;
  for(const f of e.target.files){
    if(!/^audio\//.test(f.type) && !/\.(mp3|wav|m4a|ogg|aac|flac|opus)$/i.test(f.name)) continue;
    const id = await dbTx('readwrite', st => st.add({name:f.name, blob:f}));
    list.push({name:f.name, src:URL.createObjectURL(f), id}); if(first<0) first = list.length-1;
  }
  e.target.value = '';
  if(first >= 0){ $('plist').classList.add('on'); load(first,true); }
});
aud.addEventListener('play', () => $('pp').innerHTML = '<i class="fa-solid fa-pause"></i>');
aud.addEventListener('pause', () => $('pp').innerHTML = '<i class="fa-solid fa-play"></i>');
aud.addEventListener('ended', next);
(async () => {
  const rows = await dbTx('readonly', st => st.getAll());
  (rows||[]).forEach(r => list.push({name:r.name, src:URL.createObjectURL(r.blob), id:r.id}));
  renderList();
})();
load(0,false);

function open(){el('authOverlay').classList.add('on');el('authOverlay').setAttribute('aria-hidden','false');if(auth.currentUser)showProfile(auth.currentUser);else mode('login');}
function close(){if(!auth.currentUser)return;el('authOverlay').classList.remove('on');el('authOverlay').setAttribute('aria-hidden','true');message();}
function mode(next){authMode=next;el('authForms').hidden=false;el('authProfile').hidden=true;el('authLoginTab').classList.toggle('on',next==='login');el('authRegisterTab').classList.toggle('on',next==='register');el('authNameWrap').hidden=next!=='register';el('authPassword').autocomplete=next==='login'?'current-password':'new-password';el('authSubmit').textContent=next==='login'?'เข้าสู่ระบบ':'สร้างบัญชี';el('authTitle').textContent=next==='login'?'ยินดีต้อนรับกลับ':'สร้างบัญชี ANIMEMISO';message();}
function showProfile(user){el('authForms').hidden=true;el('authProfile').hidden=false;el('authTitle').textContent='บัญชีของคุณ';el('authUserName').textContent=user.displayName||'สมาชิก ANIMEMISO';el('authUserEmail').textContent=user.email||'';}
async function submit(e){e.preventDefault();message();const email=el('authEmail').value.trim();const password=el('authPassword').value;setBusy(true);try{if(authMode==='register'){const name=el('authName').value.trim();const cred=await createUserWithEmailAndPassword(auth,email,password);if(name)await updateProfile(cred.user,{displayName:name});message('สมัครสมาชิกสำเร็จ',true);showProfile(cred.user);}else{const cred=await signInWithEmailAndPassword(auth,email,password);message('เข้าสู่ระบบสำเร็จ',true);showProfile(cred.user);}}catch(err){message(friendlyError(err.code));}finally{setBusy(false);}}
async function resetPassword(){const email=el('authEmail').value.trim();if(!email){message('กรอกอีเมลก่อน แล้วกดลืมรหัสผ่านอีกครั้ง');el('authEmail').focus();return;}try{await sendPasswordResetEmail(auth,email);message('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปยังอีเมลแล้ว',true);}catch(err){message(friendlyError(err.code));}}
async function logout(){try{await signOut(auth);message('ออกจากระบบแล้ว',true);mode('login');}catch(err){message(friendlyError(err.code));}}
onAuthStateChanged(auth,user=>{const label=el('accountLabel');if(label)label.textContent=user?(user.displayName||user.email||'บัญชี'):'เข้าสู่ระบบ';const btn=el('accountBtn');if(btn)btn.title=user?`บัญชี: ${user.email}`:'เข้าสู่ระบบหรือสมัครสมาชิก';document.body.classList.toggle('auth-locked',!user);if(user){el('authOverlay').classList.remove('on');el('authOverlay').setAttribute('aria-hidden','true');}else{el('authOverlay').classList.add('on');el('authOverlay').setAttribute('aria-hidden','false');mode('login');}});
el('authForm').addEventListener('submit',submit);
el('authOverlay').addEventListener('click',e=>{if(e.target===el('authOverlay')&&!auth.currentUser){mode('login');}});
window.ANIMEMISOAuth={open,close,mode,resetPassword,logout};
</script>
